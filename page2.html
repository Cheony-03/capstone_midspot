<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참여자 입장 - 약속 중간지점 추천</title>
    <link rel="stylesheet" href="style.css">
    <!-- 카카오 우편번호/주소 검색 API 스크립트 -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</head>
<body>
    <div class="container">
        <!-- 상단 헤더 섹션 -->
        <header class="header-section" style="margin-bottom: 2rem; text-align: center;">
            <h2 class="title" style="font-size: 1.6rem; margin-bottom: 0.5rem;">참여자 정보 입력</h2>
            <p class="description">이름과 출발지를 입력하고 모임에 참여하세요!</p>
        </header>

        <!-- 참여자 정보 입력 폼 -->
        <div class="form-section" style="margin-bottom: 1.5rem; background: #f9f9f9; padding: 1.5rem; border-radius: 8px;">
            <form id="participantForm" onsubmit="addParticipant(event)">
                <div style="margin-bottom: 1rem;">
                    <label for="userName" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">이름 (닉네임)</label>
                    <input type="text" id="userName" required placeholder="이름을 입력하세요" style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 1rem;">
                    <label for="userAddress" style="display: block; font-weight: bold; margin-bottom: 0.3rem;">출발지 주소</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="userAddress" readonly required placeholder="주소 검색 버튼을 눌러주세요" style="flex: 1; padding: 8px; box-sizing: border-box; background-color: #fff;">
                        <button type="button" onclick="execDaumPostcode()" style="padding: 8px 12px; cursor: pointer; background: #333; color: #fff; border: none; border-radius: 4px;">주소 검색</button>
                    </div>
                </div>

                <button type="submit" class="create-btn" style="width: 100%; background-color: #fee500; color: #333; font-weight: bold; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">
                    참여하기 / 출발지 저장
                </button>
            </form>
        </div>

        <!-- 참여자 목록 표시 섹션 -->
        <div class="participant-list-section" style="background: #fff; padding: 1rem; border: 1px solid #ddd; border-radius: 8px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 0.8rem; color: #333;">👥 현재 참여자 목록 (<span id="participantCount">0</span>명)</h3>
            <ul id="participantList" style="list-style: none; padding: 0; margin: 0; color: #555;">
                <li style="padding: 6px 0; border-bottom: 1px solid #eee; color: #888;">아직 참여한 사람이 없습니다.</li>
            </ul>
        </div>

        <!-- 다음 단계로 이동 버튼 (카테고리 선택 페이지로 연결) -->
        <div style="margin-top: 20px; text-align: center;">
            <button type="button" onclick="goToNextStep()" style="padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                카테고리 선택하러 가기 ➔
            </button>
        </div>
    </div>

    <!-- 참여자 관리 및 카카오 주소 API 스크립트 -->
    <script>
        // 카카오 주소 검색 API 연동 함수
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    // 도로명 주소 또는 지번 주소 설정
                    let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                    document.getElementById("userAddress").value = addr;
                }
            }).open();
        }

        // 임시 참여자 목록 저장 배열 (실제 구동 시 서버 또는 로컬스토리지 연동)
        let participants = [];

        function addParticipant(event) {
            event.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const address = document.getElementById('userAddress').value.trim();

            if (!name || !address) {
                alert('이름과 출발지를 모두 입력해주세요.');
                return;
            }

            // 참여자 추가
            participants.push({ name, address });
            updateParticipantUI();

            // 입력창 초기화
            document.getElementById('userName').value = '';
            document.getElementById('userAddress').value = '';
            alert('출발지가 성공적으로 등록되었습니다!');
        }

        function updateParticipantUI() {
            const listEl = document.getElementById('participantList');
            const countEl = document.getElementById('participantCount');
            
            countEl.textContent = participants.length;
            
            if (participants.length === 0) {
                listEl.innerHTML = `<li style="padding: 6px 0; border-bottom: 1px solid #eee; color: #888;">아직 참여한 사람이 없습니다.</li>`;
                return;
            }

            let html = '';
            participants.forEach((p, index) => {
                html += `<li style="padding: 8px 0; border-bottom: 1px solid #eee;"><strong>${index + 1}. ${p.name}</strong> (${p.address})</li>`;
            });
            listEl.innerHTML = html;
        }

        function goToNextStep() {
            if (participants.length === 0) {
                alert('최소 1명 이상의 참여자와 출발지가 등록되어야 합니다.');
                return;
            }
            // 3단계(카테고리 선택 페이지) 파일명에 맞춰 수정하세요 (예: category.html 등)
            alert('카테고리 선택 페이지로 이동합니다.');
            // location.href = 'category.html'; 
        }
    </script>
</body>
</html>
