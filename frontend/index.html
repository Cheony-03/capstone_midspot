<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약속 중간지점 추천 서비스</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 서비스 제목 및 설명 -->
        <header class="header-section">
            <h1 class="title">우리 어디서 만날까?</h1>
            <p class="description">
                친구들과의 약속, 더 이상 억울한 사람 없이!<br>
                참여자들의 출발지를 입력하면 가장 공평한 중간지점과<br>근처 추천 장소를 찾아드립니다.
            </p>
        </header>

        <!-- 모임 만들기 및 링크 공유 섹션 -->
        <div class="button-section">
            <button id="createRoomBtn" class="create-btn">모임 만들기</button>
            
            <!-- 방 생성 후 활성화될 초대 링크 복사 영역 (평소엔 숨김 처리 등 필요 시 활용) -->
            <div id="shareSection" class="share-section" style="display: none; margin-top: 15px;">
                <input type="text" id="inviteLinkInput" readonly placeholder="초대 링크가 생성됩니다." style="padding: 8px; width: 70%;">
                <button id="copyLinkBtn" class="copy-btn" style="padding: 8px;">링크 복사</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 예시 기능 (동작 테스트용, 필요에 맞게 수정하세요) -->
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/kakao.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
