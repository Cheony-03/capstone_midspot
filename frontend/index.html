<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 어디서 만날까? - 중간지점 추천 서비스</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        html, body {
            width: 100%;
            min-height: 100%;
        }
        .landing-container {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(15, 23, 42, 0.82), rgba(30, 41, 59, 0.9)),
                url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 440px;
            width: 100%;
        }
        .team-logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #4c6ef5, #3b5bdb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 20px rgba(76, 110, 245, 0.4);
        }
        .hero-card h1 {
            font-size: 24px;
            color: #111;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .hero-card p {
            font-size: 15px;
            color: #666;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .start-btn {
            width: 100%;
            padding: 16px;
            background-color: #4c6ef5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 12px rgba(76, 110, 245, 0.3);
        }
        .start-btn:hover {
            background-color: #3b5bdb;
            transform: translateY(-2px);
        }
        .start-btn:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }
        .hero-features {
            margin-top: 28px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
        .hero-features span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
        }
        @media (max-width: 420px) {
            .hero-card { padding: 32px 20px; }
            .hero-features { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <main class="landing-container">
        <section class="hero-card" aria-labelledby="page-title">
            <div class="team-logo" aria-hidden="true">📍</div>
            <h1 id="page-title">어디서 만날까요?</h1>
            <p>우리 모두에게 가장 공평한<br>만남의 중간지점을 찾아드립니다.</p>
            <button class="start-btn" type="button" onclick="startApp()">서비스 시작하기</button>
            <div class="hero-features" aria-label="서비스 특징">
                <span>⚡ 빠른 위치 계산</span>
                <span>🗳️ 간편한 투표</span>
                <span>🗺️ 카카오맵 연동</span>
            </div>
        </section>
    </main>
    <script>
        function startApp() {
            // 방 생성 및 링크 복사 화면으로 이동합니다.
            location.href = 'page2.html';
        }
    </script>
</body>
</html>
