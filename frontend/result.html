<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결과 확인 - 약속 중간지점 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
        <!-- 상단 헤더 -->
        <header class="header-section" style="margin-bottom: 1.5rem; text-align: center;">
            <h2 class="title" style="font-size: 1.6rem; margin-bottom: 0.5rem;">최적의 중간 지점 & 추천 장소 순위</h2>
            <p class="description">참여자들의 위치를 기반으로 도출된 중간 지점과 추천 장소입니다. 투표에 참여해 보세요!</p>
        </header>

        <!-- 결과 컨텐츠 레이아웃 -->
        <div class="result-layout" style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px;">
            
            <!-- 1. 지도 크게 보기 영역 (강제 500px 적용) -->
            <div id="map" style="width: 100% !important; height: 500px !important; background-color: #e9ecef !important; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; border: 1px solid #ddd;">
                [ 카카오 지도 크게 표시 영역 (500px) ]
            </div>

            <!-- 2. 추천 장소 순위 목록 + 장소별 체크박스 투표 영역 -->
            <div class="cafe-list-container" style="background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
                <h3 style="font-size: 1.1rem; margin-bottom: 12px; color: #333;">📍 추천 장소 순위 및 투표</h3>
                <ul id="voteList" style="list-style: none; padding: 0; margin: 0;">
                    
                    <!-- 추천 장소 1위 -->
                    <li style="display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; background: #fff;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" name="placeVote" value="place1" style="width: 18px; height: 18px; cursor: pointer;">
                            <div>
                                <span style="background: #007bff; color: #fff; padding: 2px 6px; font-size: 0.8rem; border-radius: 4px; font-weight: bold; margin-right: 5px;">1위</span>
                                <strong>스타벅스 익산점</strong> <span style="font-size: 0.85rem; color: #666;">(중간지점에서 350m)</span>
                            </div>
                        </div>
                        <span style="font-size: 0.9rem; color: #007bff; font-weight: bold;" class="vote-count">표 수: 0표</span>
                    </li>

                    <!-- 추천 장소 2위 -->
                    <li style="display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; background: #fff;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <input type="checkbox" name="placeVote" value="place2" style="width: 18px; height: 18px; cursor: pointer;">
                            <div>
                                <span style="background: #6c757d; color: #fff; padding: 2px 6px; font-size: 0.8rem; border-radius: 4px; font-weight: bold; margin-right: 5px;">2위</span>
                                <strong>투썸플레이스 대학로점</strong> <span style="font-size: 0.85rem; color: #666;">(중간지점에서 500m)</span>
                            </div>
                        </div>
                        <span style="font-size: 0.9rem; color: #007bff; font-weight: bold;" class="vote-count">표 수: 0표</span>
                    </li>

                </ul>
                
                <button type="button" onclick="submitVotes()" style="width: 100%; margin-top: 10px; padding: 10px; background: #17a2b8; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    ☑️ 내 투표 제출하기
                </button>
            </div>
        </div>

        <!-- 하단 액션 버튼 그룹 -->
        <div class="action-buttons" style="display: flex; gap: 10px;">
            <button type="button" class="create-btn" onclick="decidePlace()" style="flex: 1; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                ✨ 최종 장소로 확정하기
            </button>
            <button type="button" class="create-btn" onclick="shareLocation()" style="flex: 1; background-color: #fee500; color: #333; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                🔗 장소 공유하기
            </button>
        </div>
    </div>

    <!-- 기능 구현 스크립트 -->
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/kakao.js"></script>
    <script src="js/common.js"></script>
    <script src="js/result.js"></script>
</body>
</html>
