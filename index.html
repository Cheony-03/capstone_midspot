<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>약속 중간지점 추천 서비스</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 서비스 제목 및 설명 -->
        <header class="header-section">
            <h1 class="title">우리 어디서 만날까?</h1>
            <p class="description">
                친구들과의 약속, 더 이상 억울한 사람 없이!<br>
                3명의 위치를 입력하면 가장 공평한 중간지점과<br>근처 예쁜 카페를 추천해 드립니다.
            </p>
        </header>

        <!-- 모임 만들기 버튼 -->
        <div class="button-section">
            <button id="createRoomBtn" class="create-btn">모임 만들기</button>
        </div>
    </div>
</body>
</html>
